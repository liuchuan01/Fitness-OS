<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Muscles Viewer</title>
    <link rel="icon" href="data:," />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.177.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.177.0/examples/jsm/"
        }
      }
    </script>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0f16;
        color: #e5edf7;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
      }
      .hud {
        position: fixed;
        left: 16px;
        top: 16px;
        z-index: 10;
        padding: 12px 14px;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 10px;
        background: rgba(7, 10, 16, 0.72);
        backdrop-filter: blur(10px);
        max-width: min(420px, calc(100vw - 32px));
      }
      .hud h1 {
        margin: 0 0 6px;
        font-size: 15px;
        font-weight: 650;
      }
      .hud p {
        margin: 4px 0;
        font-size: 12px;
        line-height: 1.45;
        color: #aab6c5;
      }
      .hud code {
        color: #8ed0ff;
      }
      .badge {
        display: inline-block;
        margin-top: 8px;
        padding: 4px 8px;
        border-radius: 999px;
        background: rgba(79, 194, 255, 0.12);
        color: #8ed0ff;
        font-size: 12px;
      }
      .button-row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      button {
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.04);
        color: #e5edf7;
        border-radius: 8px;
        padding: 8px 10px;
        cursor: pointer;
      }
      button:hover {
        background: rgba(255,255,255,0.08);
      }
      .status {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 10;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(7, 10, 16, 0.72);
        border: 1px solid rgba(255,255,255,0.12);
        font-size: 12px;
        color: #aab6c5;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="hud">
      <h1>3D Muscles Viewer</h1>
      <p>默认读取 <code>bodyparts3d-fitness-taxonomy-manifest.json</code>，加载 67 肌肉同源候选。</p>
      <p>左键拖拽旋转，滚轮缩放，右键平移。</p>
      <div class="button-row">
        <button id="reset">重置视角</button>
        <button id="toggleSkin">皮肤开关</button>
        <button id="toggleMuscles">肌肉开关</button>
        <button id="toggleProfessional">专业模式</button>
        <button id="toggleWire">线框开关</button>
      </div>
      <div class="badge" id="badge">manifest preview</div>
    </div>
    <div class="status" id="status">loading...</div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

      const app = document.getElementById("app");
      const status = document.getElementById("status");
      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#0b0f16");

      const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0.25, 7.2);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      app.appendChild(renderer.domElement);

      const ambient = new THREE.HemisphereLight(0xffffff, 0x2f3642, 1.7);
      scene.add(ambient);

      const key = new THREE.DirectionalLight(0xffffff, 2.8);
      key.position.set(3, 5, 4);
      scene.add(key);

      const fill = new THREE.DirectionalLight(0x7cc9ff, 0.8);
      fill.position.set(-3, 1, 3);
      scene.add(fill);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.minDistance = 3.4;
      controls.maxDistance = 10;
      controls.target.set(0, 0.1, 0);

      let root = null;
      let skinRoot = null;
      let muscleRoot = null;
      let contract = null;
      let targetBindings = new Map();
      let wireframe = false;
      let skinVisible = true;
      let musclesVisible = true;
      let professionalMode = false;

      function setStatus(text) {
        status.textContent = text;
      }

      function frameModel(object) {
        const box = new THREE.Box3().setFromObject(object);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const scale = 4.0 / Math.max(size.x, size.y, size.z);
        object.scale.setScalar(scale);
        object.position.set(-center.x * scale, -center.y * scale + 0.05, -center.z * scale);
      }

      function setWireframe(enabled) {
        if (!root) return;
        root.traverse((child) => {
          if (!child.isMesh) return;
          if (Array.isArray(child.material)) {
            child.material.forEach((m) => (m.wireframe = enabled));
          } else {
            child.material.wireframe = enabled;
          }
        });
      }

      function setLayerVisibility(prefix, visible) {
        if (!root) return;
        root.traverse((child) => {
          if (child.isMesh && child.name.startsWith(prefix)) child.visible = visible;
        });
      }

      function normalizeModelId(value) {
        return value.replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
      }

      function buildTargetBindings(modelContract) {
        const lookup = new Map();
        for (const [muscleId, config] of Object.entries(modelContract.muscles || {})) {
          if (config.coverage === "missing") continue;
          for (const target of config.model_targets || []) {
            const key = normalizeModelId(target);
            const entries = lookup.get(key) || [];
            entries.push({ muscleId, ...config });
            lookup.set(key, entries);
          }
        }
        return lookup;
      }

      function applyDisplayMode() {
        if (!root) return;
        root.traverse((child) => {
          if (!child.isMesh || !child.name.startsWith("muscle")) return;
          const bindings = targetBindings.get(normalizeModelId(child.name)) || [];
          const isProfessional = bindings[0]?.display_mode === "professional";
          child.visible = musclesVisible && (professionalMode || !isProfessional);
        });
      }

      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath("https://unpkg.com/three@0.177.0/examples/jsm/libs/draco/");
      const loader = new GLTFLoader();
      loader.setDRACOLoader(dracoLoader);

      function loadGltf(url) {
        return new Promise((resolve, reject) => {
          loader.load(url, resolve, undefined, reject);
        });
      }

      function normalizeSkinMaterials(object) {
        object.traverse((child) => {
          if (!child.isMesh) return;
          if (child.name.startsWith("skin")) {
            child.material = new THREE.MeshBasicMaterial({
              color: "#4f6472",
              transparent: true,
              opacity: 0.12,
              side: THREE.FrontSide,
              depthWrite: false,
            });
            child.renderOrder = 1;
            return;
          }
          const materials = Array.isArray(child.material) ? child.material : [child.material];
          materials.forEach((material) => {
            material.transparent = true;
            material.opacity = 0.96;
            material.depthWrite = false;
            material.side = THREE.DoubleSide;
            if ("emissive" in material && material.color) {
              material.emissive.copy(material.color);
              material.emissiveIntensity = 0.08;
            }
          });
          child.renderOrder = 2;
        });
      }

      async function loadBody() {
        try {
          const params = new URLSearchParams(window.location.search);
          const manifestName = params.get("manifest") || "bodyparts3d-fitness-taxonomy-manifest.json";
          const [manifest, modelContract] = await Promise.all([
            fetch(`./${manifestName}`).then((res) => res.json()),
            fetch("./body-model-contract.json").then((res) => res.json()),
          ]);
          contract = modelContract;
          targetBindings = buildTargetBindings(contract);
          root = new THREE.Group();
          scene.add(root);

          if (manifest.assets.combined || manifest.assets.combined_draco) {
            const combinedAsset = params.get("combined") || manifest.assets.combined_draco || manifest.assets.combined;
            const combined = await loadGltf(`./${combinedAsset}`);
            root.add(combined.scene);
            normalizeSkinMaterials(combined.scene);
            frameModel(root);
            applyDisplayMode();
            const targetCount = Object.values(manifest.targets || {}).flat().length;
            document.getElementById("badge").textContent = `${Object.keys(manifest.targets || {}).length} groups / ${targetCount} targets`;
            setStatus(`loaded: ${combinedAsset}`);
            return;
          }

          const skinAsset = params.get("skin") || manifest.assets.skin;
          const muscleAsset = params.get("muscles") || manifest.assets.muscles;
          const [skin, muscles] = await Promise.all([
            loadGltf(`./${skinAsset}`),
            loadGltf(`./${muscleAsset}`),
          ]);

          skinRoot = skin.scene;
          muscleRoot = muscles.scene;
          normalizeSkinMaterials(skinRoot);
          root.add(muscleRoot);
          root.add(skinRoot);
          frameModel(root);

          const targetCount = Object.values(manifest.targets || {}).flat().length;
          document.getElementById("badge").textContent = `${Object.keys(manifest.targets || {}).length} groups / ${targetCount} targets`;
          setStatus(`loaded: ${skinAsset} + ${muscleAsset}`);
        } catch (error) {
          console.error(error);
          setStatus("load failed");
        }
      }

      loadBody();

      document.getElementById("reset").addEventListener("click", () => {
        camera.position.set(0, 0.25, 7.2);
        controls.target.set(0, 0.1, 0);
        controls.update();
      });

      document.getElementById("toggleWire").addEventListener("click", () => {
        wireframe = !wireframe;
        setWireframe(wireframe);
      });

      document.getElementById("toggleSkin").addEventListener("click", () => {
        skinVisible = !skinVisible;
        setLayerVisibility("skin", skinVisible);
      });

      document.getElementById("toggleMuscles").addEventListener("click", () => {
        musclesVisible = !musclesVisible;
        applyDisplayMode();
      });

      document.getElementById("toggleProfessional").addEventListener("click", (event) => {
        professionalMode = !professionalMode;
        event.currentTarget.textContent = professionalMode ? "普通模式" : "专业模式";
        applyDisplayMode();
      });

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      renderer.domElement.addEventListener("click", (event) => {
        if (!root || !contract) return;
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hit = raycaster
          .intersectObject(root, true)
          .find((entry) => entry.object.isMesh && entry.object.name.startsWith("muscle"));
        if (!hit) return;
        const bindings = targetBindings.get(normalizeModelId(hit.object.name)) || [];
        if (!bindings.length) return;
        const exact = bindings.find((binding) => binding.coverage === "exact");
        if (exact) {
          setStatus(`exact: ${exact.label_zh} (${exact.muscleId})`);
          return;
        }
        const groupId = bindings[0].group;
        const group = contract.groups[groupId];
        const labels = bindings.map((binding) => binding.label_zh).join(" / ");
        setStatus(`${bindings[0].coverage}: ${group?.label_zh || groupId} -> ${labels}`);
      });

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        if (root) root.rotation.y += 0.0025;
        renderer.render(scene, camera);
      }
      animate();
    </script>
  </body>
</html>
